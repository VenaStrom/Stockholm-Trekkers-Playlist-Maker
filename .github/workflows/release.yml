name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # After setup-node so the shim lands on the final Node's PATH (Windows needs this order)
      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Find yarn cache folder
        id: yarn-cache
        shell: bash
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache video assets
        uses: actions/cache@v6
        with:
          path: src-tauri/video-assets
          key: video-assets-${{ hashFiles('scripts/asset-urls.json') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check version is unreleased
        run: yarn check:version release

      # The stripped file body becomes the GitHub release body and, via
      # tauri-action's latest.json, the notes in the in-app update dialog
      - name: Read release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(sed '/<!--/,/-->/d' RELEASE_NOTES.md)"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error file=RELEASE_NOTES.md::RELEASE_NOTES.md is empty - write the release notes before dispatching a release."
            exit 1
          fi
          if printf '%s\n' "$body" | grep -qE '^[[:space:]]*-[[:space:]]*$'; then
            echo "::error file=RELEASE_NOTES.md::RELEASE_NOTES.md still has empty placeholder bullets - fill them in or delete them."
            exit 1
          fi
          # Guard against forgetting to update the notes between releases. The
          # version-unreleased check above guarantees the latest release here is
          # always the previous one, not the one being published.
          previous="$(gh release view --json body --jq .body 2>/dev/null || true)"
          if [ -n "$previous" ] && [ "$(printf '%s' "$body" | tr -d '\r')" = "$(printf '%s' "$previous" | tr -d '\r')" ]; then
            echo "::error file=RELEASE_NOTES.md::RELEASE_NOTES.md is identical to the last published release's notes - update it for this version."
            exit 1
          fi
          {
            echo 'body<<NOTES_EOF'
            printf '%s\n' "$body"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare bundled assets and sidecars
        run: yarn download-assets && yarn prepare-ffmpeg-sidecar

      # Builds, signs the updater artifacts, creates/updates the GitHub release,
      # and assembles latest.json across both platforms
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__ Stockholm Trekkers Playlist Maker
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
